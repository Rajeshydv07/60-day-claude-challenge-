<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Face Puzzle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #161a24;
    --surface2:  #1e2433;
    --border:    #2a3045;
    --amber:     #f0a040;
    --amber-dim: #a06820;
    --green:     #3ddc84;
    --red:       #ff5f57;
    --text:      #e8ecf4;
    --muted:     #6b7591;
    --drag-glow: #f0a040;
    --correct-glow: #3ddc84;
    --radius:    10px;
    --gap:       4px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  header {
    width: 100%;
    max-width: 700px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-mark {
    width: 36px; height: 36px;
    border: 2px solid var(--amber);
    border-radius: 6px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    padding: 5px;
  }
  .logo-mark span {
    background: var(--amber);
    border-radius: 2px;
    display: block;
  }
  .logo-mark span:last-child { background: transparent; border: 1px solid var(--amber-dim); }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--amber);
  }
  header h1 span { color: var(--muted); font-weight: 400; }

  .screen {
    width: 100%;
    max-width: 640px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeUp 0.35s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
  }

  .card-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  #video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #camera-video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #camera-hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px;
  }

  .camera-icon {
    width: 56px; height: 56px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
  }

  #face-guide {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55%; aspect-ratio: 3/4;
    border: 2px dashed rgba(240,160,64,0.5);
    border-radius: 50%;
    pointer-events: none;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 8px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, background 0.15s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--amber); color: #0d0f14; }
  .btn-primary:hover:not(:disabled) { background: #f8b55a; }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--border); }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .diff-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
  }

  .diff-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .diff-btn:hover { border-color: var(--amber); }
  .diff-btn.selected { border-color: var(--amber); background: rgba(240,160,64,0.08); }

  .diff-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    font-family: 'Space Mono', monospace;
  }
  .diff-sub { font-size: 0.7rem; color: var(--muted); }

  #preview-canvas {
    display: none;
    max-width: 240px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  #hud {
    display: flex;
    gap: 12px;
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hud-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 90px;
  }
  .hud-val {
    font-family: 'Space Mono', monospace;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--amber);
  }
  .hud-lbl {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #puzzle-board-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
  }

  #puzzle-board {
    display: grid;
    gap: var(--gap);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--gap);
    touch-action: none;
    user-select: none;
    position: relative;
  }

  .puzzle-cell {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface2);
    cursor: grab;
  }
  .puzzle-cell:active { cursor: grabbing; }

  .puzzle-cell canvas {
    display: block;
    width: 100%; height: 100%;
    border-radius: 6px;
    pointer-events: none;
  }

  .puzzle-cell.dragging { opacity: 0.25; cursor: grabbing; }

  .puzzle-cell.correct::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 3px solid var(--correct-glow);
    border-radius: 6px;
    pointer-events: none;
    box-shadow: inset 0 0 10px rgba(61,220,132,0.2), 0 0 10px rgba(61,220,132,0.15);
  }

  .puzzle-cell.drop-target::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 3px solid var(--amber);
    border-radius: 6px;
    pointer-events: none;
    background: rgba(240,160,64,0.1);
  }

  #drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    border-radius: 8px;
    border: 3px solid var(--amber);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(240,160,64,0.3);
    opacity: 0.95;
    display: none;
    overflow: hidden;
  }
  #drag-ghost canvas { display: block; }

  #develop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13,15,20,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 200;
  }
  #develop-overlay.active { display: flex; }

  .develop-text {
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    color: var(--amber);
    letter-spacing: 0.1em;
  }
  .develop-bar-wrap {
    width: 240px; height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }
  .develop-bar {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    animation: develop 0.9s ease forwards;
  }
  @keyframes develop {
    from { width: 0; }
    to   { width: 100%; }
  }

  #win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13,15,20,0.95);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 300;
    overflow-y: auto;
    padding: 32px 16px;
    animation: fadeIn 0.4s ease;
  }
  #win-overlay.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .win-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    animation: popUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popUp {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .win-badge {
    width: 72px; height: 72px;
    background: rgba(240,160,64,0.12);
    border: 2px solid var(--amber);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
  }

  .win-title {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--amber);
    text-align: center;
  }

  .win-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
  }
  .win-stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .win-stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--amber);
  }
  .win-stat-lbl {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-align: center;
  }

  .lb-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    align-self: flex-start;
  }

  #leaderboard { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  #leaderboard th {
    text-align: left;
    padding: 6px 8px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  #leaderboard td {
    padding: 8px 8px;
    border-bottom: 1px solid rgba(42,48,69,0.5);
    color: var(--text);
  }
  #leaderboard tr:first-child td { color: var(--amber); }
  #leaderboard .mono { font-family: 'Space Mono', monospace; font-size: 0.8rem; }
  #leaderboard .rank { color: var(--muted); text-align: center; }

  #error-banner {
    display: none;
    background: rgba(255,95,87,0.12);
    border: 1px solid rgba(255,95,87,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--red);
    width: 100%;
    text-align: center;
    max-width: 480px;
  }
  #error-banner.show { display: block; }

  .photo-taken-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--green);
    padding: 8px 14px;
    background: rgba(61,220,132,0.08);
    border: 1px solid rgba(61,220,132,0.2);
    border-radius: 8px;
    width: 100%;
  }

  #puzzle-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1rem; }
    .win-card { padding: 22px 16px; }
    .win-stats { gap: 8px; }
    .win-stat-val { font-size: 0.9rem; }
    .diff-grid { gap: 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-mark">
      <span></span><span></span><span></span>
      <span style="background:transparent;border:1px solid #a06820"></span>
    </div>
    <h1>FACE <span>/</span> PUZZLE</h1>
  </header>

  <!-- SCREEN 1: Camera -->
  <div class="screen active" id="screen-camera">
    <div id="video-wrap">
      <video id="camera-video" autoplay playsinline muted></video>
      <div id="camera-hint">
        <div class="camera-icon">📷</div>
        <div>Requesting camera access…</div>
      </div>
      <div id="face-guide"></div>
    </div>
    <div id="error-banner"></div>
    <canvas id="preview-canvas"></canvas>
    <div id="photo-taken-bar" class="photo-taken-bar" style="display:none">
      ✓ &nbsp;Photo captured — choose a difficulty below
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-snap">📸 &nbsp;Take Photo</button>
      <button class="btn btn-ghost" id="btn-retake" style="display:none">↺ &nbsp;Retake</button>
    </div>

    <div id="difficulty-wrap" style="display:none; width:100%">
      <div class="card">
        <div class="card-title">Choose Difficulty</div>
        <div class="diff-grid">
          <button class="diff-btn selected" data-grid="3">
            <div style="display:grid;grid-template-columns:repeat(3,10px);gap:2px">
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
              <span style="width:10px;height:10px;background:var(--amber);border-radius:2px;display:block"></span>
            </div>
            <div class="diff-label">3 × 3</div>
            <div class="diff-sub">9 pieces</div>
          </button>
          <button class="diff-btn" data-grid="4">
            <div style="display:grid;grid-template-columns:repeat(4,8px);gap:2px">
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:8px;height:8px;background:var(--amber);border-radius:1px;display:block"></span>
            </div>
            <div class="diff-label">4 × 4</div>
            <div class="diff-sub">16 pieces</div>
          </button>
          <button class="diff-btn" data-grid="5">
            <div style="display:grid;grid-template-columns:repeat(5,6px);gap:2px">
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
              <span style="width:6px;height:6px;background:var(--amber);border-radius:1px;display:block"></span>
            </div>
            <div class="diff-label">5 × 5</div>
            <div class="diff-sub">25 pieces</div>
          </button>
        </div>
        <div style="margin-top:16px;display:flex;justify-content:center">
          <button class="btn btn-primary" id="btn-start" style="min-width:180px">Start Puzzle →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: Puzzle -->
  <div class="screen" id="screen-puzzle">
    <div id="hud">
      <div class="hud-chip">
        <div class="hud-val" id="hud-time">00:00.0</div>
        <div class="hud-lbl">Time</div>
      </div>
      <div class="hud-chip">
        <div class="hud-val" id="hud-moves">0</div>
        <div class="hud-lbl">Moves</div>
      </div>
      <div class="hud-chip">
        <div class="hud-val" id="hud-correct">0/0</div>
        <div class="hud-lbl">Correct</div>
      </div>
    </div>
    <div id="puzzle-board-wrap">
      <div id="puzzle-board"></div>
    </div>
    <div id="puzzle-controls">
      <button class="btn btn-ghost" id="btn-new-photo-puzzle">📷 New Photo</button>
      <button class="btn btn-ghost" id="btn-play-again">↺ Play Again</button>
    </div>
  </div>
</div>

<!-- Develop overlay -->
<div id="develop-overlay">
  <div class="develop-text">Developing puzzle…</div>
  <div class="develop-bar-wrap">
    <div class="develop-bar" id="develop-bar"></div>
  </div>
</div>

<!-- Drag ghost -->
<div id="drag-ghost"><canvas id="ghost-canvas"></canvas></div>

<!-- Win overlay -->
<div id="win-overlay">
  <div class="win-card">
    <div class="win-badge">🎉</div>
    <div class="win-title">PUZZLE SOLVED!</div>
    <div class="win-stats">
      <div class="win-stat">
        <div class="win-stat-val" id="win-time">—</div>
        <div class="win-stat-lbl">Time</div>
      </div>
      <div class="win-stat">
        <div class="win-stat-val" id="win-moves">—</div>
        <div class="win-stat-lbl">Moves</div>
      </div>
      <div class="win-stat">
        <div class="win-stat-val" id="win-diff">—</div>
        <div class="win-stat-lbl">Difficulty</div>
      </div>
    </div>
    <div class="lb-title">🏆 &nbsp;Best Times</div>
    <table id="leaderboard" style="width:100%">
      <thead>
        <tr>
          <th style="width:30px">Rank</th>
          <th>Time</th>
          <th>Moves</th>
          <th>Grid</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-play-again-win">↺ Play Again</button>
      <button class="btn btn-ghost" id="btn-new-photo-win">📷 New Photo</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  let stream        = null;
  let photoCanvas   = null;
  let gridSize      = 3;
  let pieces        = [];
  let positions     = [];
  let moveCount     = 0;
  let startTime     = null;
  let timerRAF      = null;
  let puzzleRunning = false;
  let boardPixels   = 0;
  let dragInfo      = null;

  const video          = document.getElementById('camera-video');
  const cameraHint     = document.getElementById('camera-hint');
  const faceGuide      = document.getElementById('face-guide');
  const errorBanner    = document.getElementById('error-banner');
  const previewCanvas  = document.getElementById('preview-canvas');
  const photoTakenBar  = document.getElementById('photo-taken-bar');
  const btnSnap        = document.getElementById('btn-snap');
  const btnRetake      = document.getElementById('btn-retake');
  const difficultyWrap = document.getElementById('difficulty-wrap');
  const diffBtns       = document.querySelectorAll('.diff-btn');
  const btnStart       = document.getElementById('btn-start');
  const screenCamera   = document.getElementById('screen-camera');
  const screenPuzzle   = document.getElementById('screen-puzzle');
  const hudTime        = document.getElementById('hud-time');
  const hudMoves       = document.getElementById('hud-moves');
  const hudCorrect     = document.getElementById('hud-correct');
  const puzzleBoard    = document.getElementById('puzzle-board');
  const devOverlay     = document.getElementById('develop-overlay');
  const dragGhost      = document.getElementById('drag-ghost');
  const ghostCanvas    = document.getElementById('ghost-canvas');
  const winOverlay     = document.getElementById('win-overlay');
  const winTime        = document.getElementById('win-time');
  const winMoves       = document.getElementById('win-moves');
  const winDiff        = document.getElementById('win-diff');
  const lbBody         = document.getElementById('lb-body');
  const btnNewPhotoP   = document.getElementById('btn-new-photo-puzzle');
  const btnPlayAgain   = document.getElementById('btn-play-again');
  const btnPlayAgainW  = document.getElementById('btn-play-again-win');
  const btnNewPhotoW   = document.getElementById('btn-new-photo-win');

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.style.display = 'block';
      cameraHint.style.display = 'none';
      faceGuide.style.display = 'block';
      btnSnap.disabled = false;
    } catch (err) {
      showError(
        err.name === 'NotAllowedError'
          ? 'Camera permission denied. Please allow camera access in your browser settings and reload.'
          : 'Camera not available: ' + err.message
      );
      btnSnap.disabled = true;
      cameraHint.querySelector('div:last-child').textContent = 'Camera unavailable';
    }
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add('show');
  }

  function takePhoto() {
    const size = Math.min(video.videoWidth, video.videoHeight);
    const offX = (video.videoWidth  - size) / 2;
    const offY = (video.videoHeight - size) / 2;
    const c    = document.createElement('canvas');
    c.width = c.height = 480;
    const ctx = c.getContext('2d');
    ctx.translate(c.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, offX, offY, size, size, 0, 0, 480, 480);
    photoCanvas = c;

    previewCanvas.width  = 240;
    previewCanvas.height = 240;
    previewCanvas.getContext('2d').drawImage(c, 0, 0, 240, 240);
    previewCanvas.style.display = 'block';

    photoTakenBar.style.display  = 'flex';
    difficultyWrap.style.display = 'block';
    btnSnap.style.display        = 'none';
    btnRetake.style.display      = 'inline-flex';
    faceGuide.style.display      = 'none';
  }

  function retakePhoto() {
    photoCanvas                  = null;
    previewCanvas.style.display  = 'none';
    photoTakenBar.style.display  = 'none';
    difficultyWrap.style.display = 'none';
    btnSnap.style.display        = 'inline-flex';
    btnRetake.style.display      = 'none';
    faceGuide.style.display      = 'block';
  }

  diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      diffBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      gridSize = parseInt(btn.dataset.grid, 10);
    });
  });

  function computeBoardSize() {
    const maxW = Math.min(window.innerWidth - 48, 520);
    const maxH = window.innerHeight * 0.55;
    return Math.floor(Math.min(maxW, maxH));
  }

  function buildPieceCanvases() {
    const total = gridSize * gridSize;
    const ps    = Math.floor(boardPixels / gridSize);
    pieces = [];
    for (let i = 0; i < total; i++) {
      const col = i % gridSize;
      const row = Math.floor(i / gridSize);
      const pc  = document.createElement('canvas');
      pc.width = pc.height = ps;
      pc.getContext('2d').drawImage(
        photoCanvas,
        col * (photoCanvas.width / gridSize),
        row * (photoCanvas.height / gridSize),
        photoCanvas.width  / gridSize,
        photoCanvas.height / gridSize,
        0, 0, ps, ps
      );
      pieces.push({ correctIdx: i, canvas: pc });
    }
  }

  function scramble() {
    const total = gridSize * gridSize;
    positions   = Array.from({ length: total }, (_, i) => i);
    do {
      for (let i = total - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
      }
    } while (isSolved());
  }

  function isSolved() {
    return positions.every((p, i) => p === i);
  }

  function countCorrect() {
    return positions.filter((p, i) => p === i).length;
  }

  function renderBoard() {
    puzzleBoard.innerHTML = '';
    const total = gridSize * gridSize;
    const ps    = Math.floor(boardPixels / gridSize);

    puzzleBoard.style.gridTemplateColumns = `repeat(${gridSize}, ${ps}px)`;
    puzzleBoard.style.gridTemplateRows    = `repeat(${gridSize}, ${ps}px)`;
    puzzleBoard.style.gap     = '4px';
    puzzleBoard.style.padding = '4px';

    for (let cellIdx = 0; cellIdx < total; cellIdx++) {
      const pieceIdx = positions[cellIdx];
      const cell     = document.createElement('div');
      cell.className         = 'puzzle-cell';
      cell.style.width       = ps + 'px';
      cell.style.height      = ps + 'px';
      cell.dataset.cellIdx   = cellIdx;

      const pc = document.createElement('canvas');
      pc.width = pc.height = ps;
      pc.getContext('2d').drawImage(pieces[pieceIdx].canvas, 0, 0);
      cell.appendChild(pc);

      if (pieceIdx === cellIdx) cell.classList.add('correct');

      cell.addEventListener('mousedown',  onDragStart);
      cell.addEventListener('touchstart', onTouchStart, { passive: false });

      puzzleBoard.appendChild(cell);
    }
  }

  function onDragStart(e) {
    if (!puzzleRunning) return;
    e.preventDefault();
    const cell    = e.currentTarget;
    const cellIdx = parseInt(cell.dataset.cellIdx, 10);
    const rect    = cell.getBoundingClientRect();
    const ps      = Math.floor(boardPixels / gridSize);
    initDrag(cellIdx, ps, e.clientX, e.clientY, e.clientX - rect.left, e.clientY - rect.top);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup',   onDragEnd);
  }

  function onDragMove(e) {
    moveDragGhost(e.clientX, e.clientY);
    updateDropTarget(e.clientX, e.clientY);
  }

  function onDragEnd(e) {
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup',   onDragEnd);
    finishDrag(e.clientX, e.clientY);
  }

  function onTouchStart(e) {
    if (!puzzleRunning) return;
    e.preventDefault();
    const touch   = e.changedTouches[0];
    const cell    = e.currentTarget;
    const cellIdx = parseInt(cell.dataset.cellIdx, 10);
    const rect    = cell.getBoundingClientRect();
    const ps      = Math.floor(boardPixels / gridSize);
    initDrag(cellIdx, ps, touch.clientX, touch.clientY, touch.clientX - rect.left, touch.clientY - rect.top);
    document.addEventListener('touchmove',   onTouchMove,   { passive: false });
    document.addEventListener('touchend',    onTouchEnd);
    document.addEventListener('touchcancel', onTouchEnd);
  }

  function onTouchMove(e) {
    e.preventDefault();
    const touch = e.changedTouches[0];
    moveDragGhost(touch.clientX, touch.clientY);
    updateDropTarget(touch.clientX, touch.clientY);
  }

  function onTouchEnd(e) {
    document.removeEventListener('touchmove',   onTouchMove);
    document.removeEventListener('touchend',    onTouchEnd);
    document.removeEventListener('touchcancel', onTouchEnd);
    const touch = e.changedTouches[0];
    finishDrag(touch.clientX, touch.clientY);
  }

  function initDrag(cellIdx, ps, clientX, clientY, offsetX, offsetY) {
    dragInfo = { cellIdx, offsetX, offsetY };
    ghostCanvas.width = ghostCanvas.height = ps;
    ghostCanvas.getContext('2d').drawImage(pieces[positions[cellIdx]].canvas, 0, 0);
    dragGhost.style.width   = ps + 'px';
    dragGhost.style.height  = ps + 'px';
    dragGhost.style.display = 'block';
    moveDragGhost(clientX, clientY);
    puzzleBoard.querySelectorAll('.puzzle-cell')[cellIdx].classList.add('dragging');
  }

  function moveDragGhost(cx, cy) {
    if (!dragInfo) return;
    dragGhost.style.left = (cx - dragInfo.offsetX) + 'px';
    dragGhost.style.top  = (cy - dragInfo.offsetY) + 'px';
  }

  function updateDropTarget(cx, cy) {
    const cells = puzzleBoard.querySelectorAll('.puzzle-cell');
    cells.forEach(c => c.classList.remove('drop-target'));
    const target = getCellUnder(cx, cy);
    if (target !== null && target !== dragInfo.cellIdx) {
      cells[target].classList.add('drop-target');
    }
  }

  function getCellUnder(cx, cy) {
    const cells = puzzleBoard.querySelectorAll('.puzzle-cell');
    for (let i = 0; i < cells.length; i++) {
      const r = cells[i].getBoundingClientRect();
      if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return i;
    }
    return null;
  }

  function finishDrag(cx, cy) {
    if (!dragInfo) return;
    const targetIdx = getCellUnder(cx, cy);
    const srcIdx    = dragInfo.cellIdx;

    dragGhost.style.display = 'none';
    puzzleBoard.querySelectorAll('.puzzle-cell').forEach(c =>
      c.classList.remove('dragging', 'drop-target')
    );

    if (targetIdx !== null && targetIdx !== srcIdx) {
      [positions[srcIdx], positions[targetIdx]] = [positions[targetIdx], positions[srcIdx]];
      moveCount++;
      hudMoves.textContent = moveCount;
      updateCell(srcIdx);
      updateCell(targetIdx);
      hudCorrect.textContent = `${countCorrect()}/${gridSize * gridSize}`;
      if (isSolved()) onWin();
    }
    dragInfo = null;
  }

  function updateCell(cellIdx) {
    const cells    = puzzleBoard.querySelectorAll('.puzzle-cell');
    const cell     = cells[cellIdx];
    const pieceIdx = positions[cellIdx];
    const ps       = Math.floor(boardPixels / gridSize);
    const pc       = cell.querySelector('canvas');
    pc.width = pc.height = ps;
    pc.getContext('2d').drawImage(pieces[pieceIdx].canvas, 0, 0);
    cell.classList.toggle('correct', pieceIdx === cellIdx);
  }

  function startTimer() {
    startTime     = performance.now();
    puzzleRunning = true;
    function tick() {
      if (!puzzleRunning) return;
      hudTime.textContent = formatTime(performance.now() - startTime);
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function stopTimer() {
    puzzleRunning = false;
    if (timerRAF) cancelAnimationFrame(timerRAF);
  }

  function formatTime(ms) {
    const total   = Math.floor(ms);
    const minutes = Math.floor(total / 60000);
    const seconds = Math.floor((total % 60000) / 1000);
    const tenths  = Math.floor((total % 1000) / 100);
    return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${tenths}`;
  }

  function onWin() {
    stopTimer();
    const elapsed = performance.now() - startTime;
    const timeStr = formatTime(elapsed);
    winTime.textContent  = timeStr;
    winMoves.textContent = moveCount;
    winDiff.textContent  = `${gridSize}×${gridSize}`;
    saveScore(timeStr, elapsed, moveCount, gridSize);
    renderLeaderboard();
    setTimeout(() => { winOverlay.classList.add('active'); }, 300);
  }

  const LS_KEY = 'facepuzzle_scores_v1';

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch { return []; }
  }

  function saveScore(timeStr, elapsedMs, moves, grid) {
    const scores = loadScores();
    scores.push({
      time:  timeStr,
      ms:    elapsedMs,
      moves,
      grid:  `${grid}×${grid}`,
      date:  new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })
    });
    scores.sort((a, b) => a.ms - b.ms);
    scores.splice(5);
    localStorage.setItem(LS_KEY, JSON.stringify(scores));
  }

  function renderLeaderboard() {
    const scores = loadScores();
    lbBody.innerHTML = '';
    if (!scores.length) {
      lbBody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:14px">No scores yet</td></tr>';
      return;
    }
    scores.forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="rank">${['🥇','🥈','🥉','4','5'][i] || (i+1)}</td>
        <td class="mono">${s.time}</td>
        <td class="mono">${s.moves}</td>
        <td>${s.grid}</td>
        <td style="color:var(--muted);font-size:0.75rem">${s.date}</td>`;
      lbBody.appendChild(tr);
    });
  }

  function showScreen(name) {
    screenCamera.classList.remove('active');
    screenPuzzle.classList.remove('active');
    if (name === 'camera') screenCamera.classList.add('active');
    if (name === 'puzzle') screenPuzzle.classList.add('active');
  }

  function startPuzzle() {
    if (!photoCanvas) return;
    stopTimer();
    boardPixels = computeBoardSize();
    buildPieceCanvases();
    scramble();
    moveCount = 0;

    devOverlay.classList.add('active');
    const bar = document.getElementById('develop-bar');
    bar.style.animation = 'none';
    bar.offsetHeight;
    bar.style.animation = 'develop 0.9s ease forwards';

    setTimeout(() => {
      devOverlay.classList.remove('active');
      showScreen('puzzle');
      renderBoard();
      hudMoves.textContent   = '0';
      hudTime.textContent    = '00:00.0';
      hudCorrect.textContent = `0/${gridSize * gridSize}`;
      startTimer();
    }, 950);
  }

  function goNewPhoto() {
    stopTimer();
    winOverlay.classList.remove('active');
    photoCanvas                  = null;
    previewCanvas.style.display  = 'none';
    photoTakenBar.style.display  = 'none';
    difficultyWrap.style.display = 'none';
    btnSnap.style.display        = 'inline-flex';
    btnRetake.style.display      = 'none';
    faceGuide.style.display      = stream ? 'block' : 'none';
    showScreen('camera');
  }

  function goPlayAgain() {
    winOverlay.classList.remove('active');
    startPuzzle();
  }

  btnSnap.addEventListener('click', takePhoto);
  btnRetake.addEventListener('click', retakePhoto);
  btnStart.addEventListener('click', startPuzzle);
  btnNewPhotoP.addEventListener('click', goNewPhoto);
  btnPlayAgain.addEventListener('click', goPlayAgain);
  btnPlayAgainW.addEventListener('click', goPlayAgain);
  btnNewPhotoW.addEventListener('click', goNewPhoto);

  btnSnap.disabled = true;
  startCamera();
})();
</script>
</body>
</html>
