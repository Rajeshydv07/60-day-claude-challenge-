<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Buddy - AI Pattern Recognition</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d27;
            --text-color: #a6accd;
            --accent-color: #82aaff;
            --accent-hover: #5f89e0;
            --success-color: #c3e88d;
            --warning-color: #ffcb6b;
            --danger-color: #f07178;
            --border-color: #292d3e;
            --code-bg: #090b10;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--container-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #89ddff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--success-color);
            font-weight: bold;
        }

        textarea, select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 1rem;
            resize: vertical;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: var(--code-bg);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            color: #666;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            border-top-color: var(--code-bg);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #results-container {
            display: none;
            margin-top: 30px;
            border-top: 1px dashed var(--border-color);
            padding-top: 30px;
        }

        .result-section {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-section h3 {
            color: var(--warning-color);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            font-size: 1.2rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .badge-primary { background-color: rgba(130, 170, 255, 0.2); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .badge-success { background-color: rgba(195, 232, 141, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }
        .badge-danger { background-color: rgba(240, 113, 120, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); }

        pre {
            background-color: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            color: #e6e6e6;
            border: 1px solid var(--border-color);
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        .hint-btn {
            background-color: transparent;
            border: 1px solid var(--success-color);
            color: var(--success-color);
            margin-bottom: 10px;
            width: auto;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .hint-btn:hover {
            background-color: rgba(195, 232, 141, 0.1);
        }

        .hint-content {
            display: none;
            padding: 15px;
            background-color: rgba(195, 232, 141, 0.05);
            border-left: 3px solid var(--success-color);
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
        }

        .api-key-container {
            background-color: rgba(255, 203, 107, 0.1);
            border: 1px solid var(--warning-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .api-key-container label {
            color: var(--warning-color);
        }

        .error-message {
            color: var(--danger-color);
            background-color: rgba(240, 113, 120, 0.1);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--danger-color);
            margin-top: 20px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 0.8rem;
            color: #89ddff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚀 DSA Buddy</h1>
        <p class="subtitle">> Pattern Recognition for Beginners // Think before you code</p>
    </header>

    <div class="api-key-container">
        <label for="api-key">🔑 Anthropic API Key (Saved Locally)</label>
        <input type="password" id="api-key" placeholder="sk-ant-api03-...">
    </div>

    <div class="form-group">
        <label for="problem-statement">📝 Paste Problem Statement here:</label>
        <textarea id="problem-statement" rows="8" placeholder="E.g., Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target..."></textarea>
    </div>

    <div class="form-group">
        <label for="language">💻 Target Language (for pseudocode):</label>
        <select id="language">
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="C++">C++</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Go">Go</option>
            <option value="Language Independent">Language Independent</option>
        </select>
    </div>

    <button id="analyze-btn">
        <span>Analyze Problem</span>
        <div class="loader" id="loader"></div>
    </button>

    <div id="error-box" class="error-message"></div>

    <div id="results-container">
        <!-- Pattern Identification -->
        <div class="result-section">
            <h3>🔍 Pattern Identification</h3>
            <div id="pattern-tags"></div>
            <p id="pattern-explanation" style="margin-top: 15px;"></p>
        </div>

        <!-- Complexity Analysis -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="label">Time Complexity</div>
                <div class="value" id="time-complexity"></div>
            </div>
            <div class="stat-box">
                <div class="label">Space Complexity</div>
                <div class="value" id="space-complexity"></div>
            </div>
        </div>

        <!-- Approach -->
        <div class="result-section">
            <h3>🧠 Step-by-Step Approach</h3>
            <div id="approach-content"></div>
        </div>

        <!-- Pseudocode -->
        <div class="result-section">
            <h3>📝 Pseudocode</h3>
            <pre><code id="pseudocode-content"></code></pre>
        </div>

        <!-- Progressive Hints -->
        <div class="result-section" id="hints-section">
            <h3>💡 Progressive Hints</h3>
            <div id="hints-container"></div>
        </div>

        <!-- Concepts to Revise -->
        <div class="result-section">
            <h3>📚 Concepts to Revise</h3>
            <ul id="concepts-list"></ul>
        </div>
    </div>
</div>

<script>
    // System prompt directing Claude's behavior
    const SYSTEM_PROMPT = `You are DSA Buddy, an expert coding tutor focused on pattern recognition. 
Your goal is NOT to give the full solution code, but to guide the user towards solving it themselves.
Analyze the problem statement and identify the underlying algorithm pattern.

Return ONLY a raw JSON object (without markdown blocks or backticks) with the following structure:
{
    "pattern_name": "String (e.g., 'Two Pointers', 'Sliding Window', 'Dynamic Programming')",
    "pattern_explanation": "String explaining WHY this pattern fits the problem based on the problem characteristics.",
    "time_complexity": "String (e.g., 'O(N)')",
    "space_complexity": "String (e.g., 'O(1)')",
    "approach": ["Array of strings", "Each string is a step in the logical approach", "Keep it simple and intuitive"],
    "pseudocode": "String containing the pseudocode. Do not write actual implementation code.",
    "hints": ["Array of strings", "Hint 1 (Vague)", "Hint 2 (More specific)", "Hint 3 (Almost giving away the logic)"],
    "concepts_to_revise": ["Array of strings listing prerequisite topics to study"]
}`;

    // DOM Elements
    const apiKeyInput = document.getElementById('api-key');
    const problemInput = document.getElementById('problem-statement');
    const languageSelect = document.getElementById('language');
    const analyzeBtn = document.getElementById('analyze-btn');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const resultsContainer = document.getElementById('results-container');

    // Result DOM Elements
    const patternTags = document.getElementById('pattern-tags');
    const patternExplanation = document.getElementById('pattern-explanation');
    const timeComplexity = document.getElementById('time-complexity');
    const spaceComplexity = document.getElementById('space-complexity');
    const approachContent = document.getElementById('approach-content');
    const pseudocodeContent = document.getElementById('pseudocode-content');
    const hintsContainer = document.getElementById('hints-container');
    const conceptsList = document.getElementById('concepts-list');

    // Load saved API key
    const savedKey = localStorage.getItem('anthropic_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    // Save API key on change
    apiKeyInput.addEventListener('change', (e) => {
        localStorage.setItem('anthropic_api_key', e.target.value);
    });

    analyzeBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        const problem = problemInput.value.trim();
        const language = languageSelect.value;

        if (!apiKey) {
            showError('Please enter your Anthropic API Key.');
            return;
        }

        if (!problem) {
            showError('Please paste a problem statement.');
            return;
        }

        // Reset UI
        errorBox.style.display = 'none';
        resultsContainer.style.display = 'none';
        analyzeBtn.disabled = true;
        loader.style.display = 'block';

        try {
            const result = await fetchClaudeAnalysis(apiKey, problem, language);
            renderResults(result);
        } catch (err) {
            showError(err.message || 'An error occurred while analyzing the problem.');
        } finally {
            analyzeBtn.disabled = false;
            loader.style.display = 'none';
        }
    });

    async function fetchClaudeAnalysis(apiKey, problem, language) {
        const prompt = `Analyze this DSA problem for a beginner. The target language for context is ${language}.\n\nProblem Statement:\n${problem}`;

        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true' // Required for client-side API calls
            },
            body: JSON.stringify({
                model: 'claude-3-haiku-20240307',
                max_tokens: 1500,
                system: SYSTEM_PROMPT,
                messages: [
                    { role: 'user', content: prompt }
                ],
                temperature: 0.2 // Low temperature for more consistent, structured JSON output
            })
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(`API Error: ${errData.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const contentText = data.content[0].text;
        
        // Extract JSON from output in case Claude wrapped it in markdown or text
        let jsonStr = contentText;
        const jsonMatch = contentText.match(/\\{.*\\}/s);
        if (jsonMatch) {
            jsonStr = jsonMatch[0];
        }

        return JSON.parse(jsonStr);
    }

    function renderResults(data) {
        // Pattern
        patternTags.innerHTML = \`<span class="badge badge-primary">\${data.pattern_name}</span>\`;
        patternExplanation.textContent = data.pattern_explanation;

        // Complexity
        timeComplexity.textContent = data.time_complexity;
        spaceComplexity.textContent = data.space_complexity;

        // Approach
        approachContent.innerHTML = '<ul>' + data.approach.map(step => \`<li>\${step}</li>\`).join('') + '</ul>';

        // Pseudocode
        pseudocodeContent.textContent = data.pseudocode;

        // Hints
        hintsContainer.innerHTML = '';
        data.hints.forEach((hint, index) => {
            const btnId = \`hint-btn-\${index}\`;
            const contentId = \`hint-content-\${index}\`;
            
            hintsContainer.innerHTML += \`
                <button class="hint-btn" id="\${btnId}" onclick="toggleHint('\${contentId}', '\${btnId}')">
                    👀 Reveal Hint \${index + 1}
                </button>
                <div class="hint-content" id="\${contentId}">\${hint}</div>
            \`;
        });

        // Concepts
        conceptsList.innerHTML = data.concepts_to_revise.map(concept => \`<li><span class="badge badge-success">#</span> \${concept}</li>\`).join('');

        // Show results
        resultsContainer.style.display = 'block';
    }

    // Global function for hint toggling
    window.toggleHint = function(contentId, btnId) {
        const content = document.getElementById(contentId);
        const btn = document.getElementById(btnId);
        
        if (content.style.display === 'block') {
            content.style.display = 'none';
            btn.innerHTML = btn.innerHTML.replace('Hide', 'Reveal');
        } else {
            content.style.display = 'block';
            btn.innerHTML = btn.innerHTML.replace('Reveal', 'Hide');
        }
    };

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
